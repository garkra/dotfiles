# Font
font_family      FiraCode Nerd Font
font_size        14.0

# Theme — Gruvbox Dark
# Based on https://github.com/morhetz/gruvbox by morhetz
# Adapted from https://github.com/wdomitrz/kitty_gruvbox_theme

cursor                  #928374
cursor_text_color       background

url_color               #83a598

visual_bell_color       #8ec07c
bell_border_color       #8ec07c

active_border_color     #d3869b
inactive_border_color   #665c54

foreground              #ebdbb2
background              #282828
selection_foreground    #928374
selection_background    #ebdbb2

active_tab_foreground   #fbf1c7
active_tab_background   #665c54
inactive_tab_foreground #a89984
inactive_tab_background #3c3836

# black (bg3/bg4)
color0                  #665c54
color8                  #7c6f64

# red
color1                  #cc241d
color9                  #fb4934

# green
color2                  #98971a
color10                 #b8bb26

# yellow
color3                  #d79921
color11                 #fabd2f

# blue
color4                  #458588
color12                 #83a598

# purple
color5                  #b16286
color13                 #d3869b

# aqua
color6                  #689d6a
color14                 #8ec07c

# white (fg4/fg3)
color7                  #a89984
color15                 #bdae93

# Window
background_opacity   0.95
window_padding_width 4
hide_window_decorations titlebar-only

# Performance
repaint_delay    6
input_delay      1

# Tabs
tab_bar_style    powerline
tab_title_template "{index}: {title}"
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Rename tab
map cmd+shift+r set_tab_title

# Splits
enabled_layouts splits
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+shift+h neighboring_window left
map cmd+shift+l neighboring_window right
map cmd+shift+k neighboring_window up
map cmd+shift+j neighboring_window down
map cmd+w close_window
map cmd+shift+left resize_window narrower
map cmd+shift+right resize_window wider
map cmd+shift+up resize_window taller
map cmd+shift+down resize_window shorter
map cmd+alt+h move_window left
map cmd+alt+l move_window right
map cmd+alt+k move_window up
map cmd+alt+j move_window down

# Cursor
cursor_trail     3

# Misc
enable_audio_bell    yes
confirm_os_window_close 1
macos_option_as_alt  yes
