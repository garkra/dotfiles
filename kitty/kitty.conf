# Font
font_family      Iosevka Nerd Font Mono
font_size        14.0

# Window
# background_opacity   0.95
# window_padding_width 4
hide_window_decorations titlebar-only

# Performance
repaint_delay    6
input_delay      1

# Tabs
tab_bar_style    powerline
tab_title_template "{index}: {title}"
map super+shift+] next_tab
map super+shift+[ previous_tab
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
map super+9 goto_tab 9

# Rename tab
map super+shift+r set_tab_title

# Splits
enabled_layouts splits,stack
map super+shift+f toggle_layout stack
map super+d launch --location=vsplit --cwd=current
map super+shift+d launch --location=hsplit --cwd=current
map super+shift+h neighboring_window left
map super+shift+l neighboring_window right
map super+shift+k neighboring_window up
map super+shift+j neighboring_window down
map super+w close_window
map super+shift+left resize_window narrower
map super+shift+right resize_window wider
map super+shift+up resize_window taller
map super+shift+down resize_window shorter
map super+alt+h move_window left
map super+alt+l move_window right
map super+alt+k move_window up
map super+alt+j move_window down

# Window borders
window_border_width      1.5pt
draw_minimal_borders     no
# active_border_color and inactive_border_color are set in current-theme.conf

# Cursor
cursor_trail     3
cursor_blink_interval 0.5

# Misc
copy_on_select       yes
enable_audio_bell    yes
confirm_os_window_close 1
macos_option_as_alt  yes

# BEGIN_KITTY_THEME
# Gruvbox Dark Hard
include current-theme.conf
# END_KITTY_THEME
