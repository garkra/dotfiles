# Font
font_family      FiraCode Nerd Font
font_size        14.0

# Theme (gruvbox dark)
foreground       #ebdbb2
background       #282828
selection_foreground #282828
selection_background #ebdbb2

# Gruvbox colors
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# Window
background_opacity   0.95
window_padding_width 4
hide_window_decorations titlebar-only

# Performance
repaint_delay    6
input_delay      1

# Tabs
tab_bar_style    powerline
tab_title_template "{index}: {title}"
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Rename tab
map cmd+shift+r set_tab_title

# Splits
enabled_layouts splits
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+shift+h neighboring_window left
map cmd+shift+l neighboring_window right
map cmd+shift+k neighboring_window up
map cmd+shift+j neighboring_window down
map cmd+w close_window
map cmd+shift+left resize_window narrower
map cmd+shift+right resize_window wider
map cmd+shift+up resize_window taller
map cmd+shift+down resize_window shorter

# Cursor
cursor_trail     3

# Misc
enable_audio_bell    yes
confirm_os_window_close 1
macos_option_as_alt  yes
