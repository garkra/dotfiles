# Font
font_family      FiraCode Nerd Font
font_size        14.0

# Theme (gruvbox dark)
foreground       #ebdbb2
background       #282828
selection_foreground #282828
selection_background #ebdbb2

# Gruvbox colors
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# Window
background_opacity   0.95
window_padding_width 4
hide_window_decorations titlebar-only

# Performance
repaint_delay    6
input_delay      1

# Cursor
cursor_trail     3

# Misc
enable_audio_bell    no
confirm_os_window_close 0
macos_option_as_alt  yes
