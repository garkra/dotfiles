# Font
font_family      Iosevka Nerd Font Mono
font_size        14.0

# Window
background_opacity   0.95
hide_window_decorations titlebar-only

# Performance
repaint_delay    6
input_delay      1

# Tabs
tab_bar_style    powerline
# A bell in an unfocused tab (e.g. pi finishing its turn) marks the tab with a
# gruvbox-orange dot until you visit it.
tab_title_template "{fmt.fg._d65d0e}{bell_symbol}{fmt.fg.tab}{index}: {title}"
bell_on_tab      "● "
map super+shift+] next_tab
map super+shift+[ previous_tab
map super+alt+] move_tab_forward
map super+alt+[ move_tab_backward
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
map super+9 goto_tab 9

# Rename tab
map super+shift+r set_tab_title

# Splits
enabled_layouts splits,stack
map super+shift+f toggle_layout stack
map super+d launch --location=vsplit --cwd=current
map super+shift+d launch --location=hsplit --cwd=current
map super+shift+h neighboring_window left
map super+shift+l neighboring_window right
map super+shift+k neighboring_window up
map super+shift+j neighboring_window down
map super+w close_window
map super+shift+left resize_window narrower
map super+shift+right resize_window wider
map super+shift+up resize_window taller
map super+shift+down resize_window shorter
map super+alt+h move_window left
map super+alt+l move_window right
map super+alt+k move_window up
map super+alt+j move_window down

# Window borders — minimal: a single line shared between neighboring panes, no
# borders on the outer edges. Focus is signaled by dimming inactive pane text
# hard (a shared border can't disambiguate two panes, so dimming is the cue).
window_border_width      1.5pt
draw_minimal_borders     yes
window_margin_width      0
window_padding_width     0
active_border_color      #d65d0e
inactive_border_color    #3c3836
inactive_text_alpha      0.55

# Cursor
cursor_trail     3
cursor_blink_interval 0.5

# Misc
copy_on_select       yes

# Remote control via socket so `kitty @` works from lazygit running inside
# nvim's pty (tty-based control can't reach kitty through the nesting).
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
enable_audio_bell    yes
confirm_os_window_close 1
macos_option_as_alt  yes

# BEGIN_KITTY_THEME
# Gruvbox Dark Hard
include current-theme.conf
# END_KITTY_THEME
